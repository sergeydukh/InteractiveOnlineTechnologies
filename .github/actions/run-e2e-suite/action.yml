name: Run remote E2E suite
description: Install the required runtime and execute one remote Playwright suite

inputs:
  suite:
    description: Suite to execute
    required: true
  cross_browser_smoke:
    description: Run smoke in Chromium, Firefox and WebKit
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
      shell: bash
    - name: Select suite runtime
      id: runtime
      shell: bash
      env:
        CROSS_BROWSER_SMOKE: ${{ inputs.cross_browser_smoke }}
        SUITE: ${{ inputs.suite }}
      run: |
        case "$SUITE" in
          api) browsers="none" ;;
          smoke)
            if [[ "$CROSS_BROWSER_SMOKE" == "true" ]]; then
              browsers="cross-browser"
            else
              browsers="chromium"
            fi
            ;;
          core|ui|integration-observability|integration-user-flows|known-defects) browsers="chromium" ;;
          *) exit 2 ;;
        esac
        echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
    - name: Check QA authentication before browser installation
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        const baseUrl = (process.env.BASE_URL || 'https://qa-a.recruitment.mediamarslab.com').replace(/\/+$/, '');
        const response = await fetch(`${baseUrl}/api/auth/login`, {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-access-key': process.env.ACCESS_KEY },
          body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
        });
        if (response.status === 429) {
          const retryAfter = response.headers.get('retry-after') || 'unknown';
          console.error(`::error title=QA rate limit active::Retry after ${retryAfter} seconds, then rerun this suite.`);
          process.exit(1);
        }
        if (!response.ok) {
          console.error(`::error title=QA preflight failed::Admin login returned HTTP ${response.status}.`);
          process.exit(1);
        }
        console.log('QA authentication preflight passed.');
        NODE
    - name: Cache Playwright browsers
      id: browser-cache
      if: steps.runtime.outputs.browsers != 'none'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.browsers }}-${{ hashFiles('package-lock.json') }}
    - name: Install WebKit runtime library
      if: steps.runtime.outputs.browsers == 'cross-browser'
      shell: bash
      run: sudo apt-get install --yes --no-install-recommends libwoff1
    - name: Install required Playwright browsers
      if: steps.runtime.outputs.browsers != 'none' && steps.browser-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        case "${{ steps.runtime.outputs.browsers }}" in
          chromium) npx playwright install chromium ;;
          cross-browser) npx playwright install chromium firefox webkit ;;
        esac
    - name: Run remote tests
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
      run: |
        case "$SUITE" in
          smoke)
            if [[ "${{ inputs.cross_browser_smoke }}" == "true" ]]; then
              npm run test:cross-browser-smoke
            else
              npm run test:smoke
            fi
            ;;
          api) npm run test:api ;;
          core) npm run test:core ;;
          ui) npm run test:ui ;;
          integration-observability) npm run test:integration:observability ;;
          integration-user-flows) npm run test:integration:user-flows ;;
          known-defects) npm run test:known-defects ;;
        esac
    - name: Scan reports for configured secrets
      id: artifact_scan
      if: always()
      shell: bash
      run: npm run artifacts:scan
    - name: Upload reports and diagnostics
      if: always() && steps.artifact_scan.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: e2e-${{ inputs.suite }}-${{ github.run_id }}
        path: |
          playwright-report
          test-results
        retention-days: 14
