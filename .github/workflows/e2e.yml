name: Remote E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to execute
        required: true
        default: smoke
        type: choice
        options: [smoke, api, ui, integration, known-defects, all]
      environment:
        description: Protected GitHub Environment
        required: true
        default: qa
        type: choice
        options: [qa]
  workflow_call:
    inputs:
      suite:
        required: false
        default: smoke
        type: string
      environment:
        required: false
        default: qa
        type: string
    secrets:
      ACCESS_KEY: { required: true }
      ADMIN_EMAIL: { required: true }
      ADMIN_PASSWORD: { required: true }
      ANALYTICS_BASIC_USER: { required: true }
      ANALYTICS_BASIC_PASSWORD: { required: true }
  repository_dispatch:
    types: [qa-environment-deployed]

permissions:
  contents: read

concurrency:
  group: remote-e2e-${{ inputs.environment || 'qa' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      suite: ${{ steps.target.outputs.suite }}
    steps:
      - name: Resolve requested target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite="$REQUESTED_SUITE"
          if [[ -z "$suite" && "$EVENT_NAME" == "repository_dispatch" ]]; then suite="all"; fi
          if [[ -z "$suite" ]]; then suite="smoke"; fi
          case "$suite" in
            smoke|api|ui|integration|known-defects|all) ;;
            *) exit 2 ;;
          esac
          environment="$REQUESTED_ENVIRONMENT"
          if [[ -z "$environment" ]]; then environment="qa"; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  selected-suite:
    needs: resolve
    if: needs.resolve.outputs.suite != 'all' && needs.resolve.outputs.suite != 'integration'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
      TEST_RUN_ID: ${{ github.event.client_payload.deployment_sha || github.sha }}-${{ github.run_id }}-${{ needs.resolve.outputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-e2e-suite
        with:
          suite: ${{ needs.resolve.outputs.suite }}
          cross_browser_smoke: ${{ needs.resolve.outputs.suite == 'smoke' }}

  all-core:
    needs: resolve
    if: needs.resolve.outputs.suite == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
      TEST_RUN_ID: ${{ github.event.client_payload.deployment_sha || github.sha }}-${{ github.run_id }}-core
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-e2e-suite
        with:
          suite: core
          cross_browser_smoke: false

  integration-suites:
    needs: [resolve, all-core]
    if: always() && (needs.resolve.outputs.suite == 'all' || needs.resolve.outputs.suite == 'integration')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [integration-observability, integration-user-flows, integration-pagination]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
      TEST_RUN_ID: ${{ github.event.client_payload.deployment_sha || github.sha }}-${{ github.run_id }}-${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-e2e-suite
        with:
          suite: ${{ matrix.suite }}
          cross_browser_smoke: false
