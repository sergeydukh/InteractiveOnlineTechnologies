name: Remote E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to execute
        required: true
        default: smoke
        type: choice
        options: [smoke, api, ui, integration, known-defects, all]
      environment:
        description: Protected GitHub Environment
        required: true
        default: qa
        type: choice
        options: [qa]
  workflow_call:
    inputs:
      suite:
        required: false
        default: smoke
        type: string
      environment:
        required: false
        default: qa
        type: string
    secrets:
      ACCESS_KEY: { required: true }
      ADMIN_EMAIL: { required: true }
      ADMIN_PASSWORD: { required: true }
      ANALYTICS_BASIC_USER: { required: true }
      ANALYTICS_BASIC_PASSWORD: { required: true }
  repository_dispatch:
    types: [qa-environment-deployed]

permissions:
  contents: read

concurrency:
  group: remote-e2e-${{ inputs.environment || 'qa' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      suite: ${{ steps.target.outputs.suite }}
    steps:
      - name: Resolve requested target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite="$REQUESTED_SUITE"
          if [[ -z "$suite" && "$EVENT_NAME" == "repository_dispatch" ]]; then suite="all"; fi
          if [[ -z "$suite" ]]; then suite="smoke"; fi
          case "$suite" in
            smoke|api|ui|integration|known-defects|all) ;;
            *) exit 2 ;;
          esac
          environment="$REQUESTED_ENVIRONMENT"
          if [[ -z "$environment" ]]; then environment="qa"; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  selected-suite:
    needs: resolve
    if: needs.resolve.outputs.suite != 'all'
    uses: ./.github/workflows/e2e-suite.yml
    with:
      suite: ${{ needs.resolve.outputs.suite }}
      environment: ${{ needs.resolve.outputs.environment }}
      cross_browser_smoke: ${{ needs.resolve.outputs.suite == 'smoke' }}
    secrets: inherit

  all-core:
    needs: resolve
    if: needs.resolve.outputs.suite == 'all'
    uses: ./.github/workflows/e2e-suite.yml
    with:
      suite: core
      environment: ${{ needs.resolve.outputs.environment }}
      cross_browser_smoke: false
    secrets: inherit

  all-integration:
    needs: [resolve, all-core]
    if: always() && needs.resolve.outputs.suite == 'all'
    uses: ./.github/workflows/e2e-suite.yml
    with:
      suite: integration
      environment: ${{ needs.resolve.outputs.environment }}
      cross_browser_smoke: false
    secrets: inherit
