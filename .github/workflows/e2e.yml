name: Remote E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to execute
        required: true
        default: smoke
        type: choice
        options: [smoke, api, ui, integration, known-defects, all]
      environment:
        description: Protected GitHub Environment
        required: true
        default: qa
        type: choice
        options: [qa]
  workflow_call:
    inputs:
      suite:
        required: false
        default: smoke
        type: string
      environment:
        required: false
        default: qa
        type: string
    secrets:
      ACCESS_KEY: { required: true }
      ADMIN_EMAIL: { required: true }
      ADMIN_PASSWORD: { required: true }
      ANALYTICS_BASIC_USER: { required: true }
      ANALYTICS_BASIC_PASSWORD: { required: true }
  repository_dispatch:
    types: [qa-environment-deployed]

permissions:
  contents: read

concurrency:
  group: remote-e2e-${{ inputs.environment || 'qa' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment || 'qa' }}
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
      TEST_RUN_ID: ${{ github.event.client_payload.deployment_sha || github.sha }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select suite
        id: suite
        shell: bash
        env:
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          suite="$REQUESTED_SUITE"
          if [[ -z "$suite" && "${{ github.event_name }}" == "repository_dispatch" ]]; then suite="all"; fi
          if [[ -z "$suite" ]]; then suite="smoke"; fi
          case "$suite" in
            api) browsers="none" ;;
            smoke) browsers="cross-browser" ;;
            ui|integration|known-defects|all) browsers="chromium" ;;
            *) exit 2 ;;
          esac
          echo "value=$suite" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
      - name: Check QA rate limit before browser installation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = (process.env.BASE_URL || 'https://qa-a.recruitment.mediamarslab.com').replace(/\/+$/, '');
          const response = await fetch(`${baseUrl}/api/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-access-key': process.env.ACCESS_KEY },
            body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
          });
          if (response.status === 429) {
            const retryAfter = response.headers.get('retry-after') || 'unknown';
            console.error(`::error title=QA rate limit active::Retry after ${retryAfter} seconds, then rerun this workflow.`);
            process.exit(1);
          }
          if (!response.ok) {
            console.error(`::error title=QA preflight failed::Admin login returned HTTP ${response.status}.`);
            process.exit(1);
          }
          console.log('QA preflight passed.');
          NODE
      - name: Cache Playwright browsers
        if: steps.suite.outputs.browsers != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.suite.outputs.browsers }}-${{ hashFiles('package-lock.json') }}
      - name: Install required Playwright browsers
        shell: bash
        run: |
          case "${{ steps.suite.outputs.browsers }}" in
            none) ;;
            chromium) npx playwright install --with-deps chromium ;;
            cross-browser) npx playwright install --with-deps chromium firefox webkit ;;
          esac
      - name: Run remote tests
        shell: bash
        run: |
          case "${{ steps.suite.outputs.value }}" in
            smoke) npm run test:cross-browser-smoke ;;
            api) npm run test:api ;;
            ui) npm run test:ui ;;
            integration) npm run test:integration ;;
            known-defects) npm run test:known-defects ;;
            all) npm test ;;
          esac
      - name: Scan reports for configured secrets
        id: artifact_scan
        if: always()
        run: npm run artifacts:scan
      - name: Upload reports and diagnostics
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ steps.suite.outputs.value }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
