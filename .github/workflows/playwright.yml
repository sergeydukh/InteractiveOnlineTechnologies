name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      full_name:
        description: Full name for vacancy application
        required: true
        type: string
      test_tag:
        description: Test tag to run
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - api
          - ui
          - integration

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Bootstrap application credentials
        run: npm run secrets:bootstrap
        env:
          APPLICANT_FULL_NAME: ${{ inputs.full_name }}
          ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
          ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}

      - name: Typecheck
        run: npm run typecheck

      - name: Run selected tests
        shell: bash
        run: |
          case "${{ inputs.test_tag }}" in
            all)
              npx playwright test
              ;;
            smoke)
              npx playwright test --grep @smoke
              ;;
            api)
              npx playwright test --grep @api
              ;;
            ui)
              npx playwright test --grep @ui
              ;;
            integration)
              npx playwright test --grep @integration
              ;;
            *)
              echo "Unsupported test_tag: ${{ inputs.test_tag }}"
              exit 1
              ;;
          esac

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
