name: Remote E2E suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      environment:
        required: true
        type: string
      cross_browser_smoke:
        required: false
        default: false
        type: boolean
    secrets:
      ACCESS_KEY: { required: true }
      ADMIN_EMAIL: { required: true }
      ADMIN_PASSWORD: { required: true }
      ANALYTICS_BASIC_USER: { required: true }
      ANALYTICS_BASIC_PASSWORD: { required: true }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    env:
      ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANALYTICS_BASIC_USER: ${{ secrets.ANALYTICS_BASIC_USER }}
      ANALYTICS_BASIC_PASSWORD: ${{ secrets.ANALYTICS_BASIC_PASSWORD }}
      TEST_RUN_ID: ${{ github.event.client_payload.deployment_sha || github.sha }}-${{ github.run_id }}-${{ inputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select suite runtime
        id: runtime
        shell: bash
        env:
          CROSS_BROWSER_SMOKE: ${{ inputs.cross_browser_smoke }}
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            api) browsers="none" ;;
            smoke)
              if [[ "$CROSS_BROWSER_SMOKE" == "true" ]]; then
                browsers="cross-browser"
              else
                browsers="chromium"
              fi
              ;;
            core|ui|integration|known-defects) browsers="chromium" ;;
            *) exit 2 ;;
          esac
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
      - name: Check QA authentication before browser installation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = (process.env.BASE_URL || 'https://qa-a.recruitment.mediamarslab.com').replace(/\/+$/, '');
          const response = await fetch(`${baseUrl}/api/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-access-key': process.env.ACCESS_KEY },
            body: JSON.stringify({ email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD }),
          });
          if (response.status === 429) {
            const retryAfter = response.headers.get('retry-after') || 'unknown';
            console.error(`::error title=QA rate limit active::Retry after ${retryAfter} seconds, then rerun this suite.`);
            process.exit(1);
          }
          if (!response.ok) {
            console.error(`::error title=QA preflight failed::Admin login returned HTTP ${response.status}.`);
            process.exit(1);
          }
          console.log('QA authentication preflight passed.');
          NODE
      - name: Cache Playwright browsers
        if: steps.runtime.outputs.browsers != 'none'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.runtime.outputs.browsers }}-${{ hashFiles('package-lock.json') }}
      - name: Install required Playwright browsers
        shell: bash
        run: |
          case "${{ steps.runtime.outputs.browsers }}" in
            none) ;;
            chromium) npx playwright install --with-deps chromium ;;
            cross-browser) npx playwright install --with-deps chromium firefox webkit ;;
          esac
      - name: Run remote tests
        shell: bash
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            smoke)
              if [[ "${{ inputs.cross_browser_smoke }}" == "true" ]]; then
                npm run test:cross-browser-smoke
              else
                npm run test:smoke
              fi
              ;;
            api) npm run test:api ;;
            core) npm run test:core ;;
            ui) npm run test:ui ;;
            integration) npm run test:integration ;;
            known-defects) npm run test:known-defects ;;
          esac
      - name: Scan reports for configured secrets
        id: artifact_scan
        if: always()
        run: npm run artifacts:scan
      - name: Upload reports and diagnostics
        if: always() && steps.artifact_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ inputs.suite }}-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
